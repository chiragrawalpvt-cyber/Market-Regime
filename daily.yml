name: daily-regime
on:
  schedule:            # GitHub cron is UTC and can start 5-60 min late
    - cron: '30 11 * * 1-5'   # 17:00 IST
    - cron: '0 13 * * 1-5'    # 18:30 IST (retry: NSE files are often published after 17:00)
    - cron: '30 15 * * 1-5'   # 21:00 IST (final retry)
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: regime
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests
      - run: python -m regime.update
      - name: Commit data
        if: always()
        run: |
          git config user.name "regime-bot"; git config user.email "regime-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || { git commit -m "data: $(date -u +%F\ %H:%M)"; git pull --rebase; git push; }
  deploy:              # only if you use GitHub Pages; set repo variable DEPLOY_PAGES=true
    needs: update
    if: ${{ always() && vars.DEPLOY_PAGES == 'true' }}
    runs-on: ubuntu-latest
    environment: github-pages
    steps:
      - uses: actions/checkout@v4
      - run: mkdir _site && cp index.html _site/ && cp -r data _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: {path: _site}
      - uses: actions/deploy-pages@v4
